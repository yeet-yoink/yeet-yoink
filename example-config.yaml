---
version: 0
backends:
  memcache:
    - tag: "memcache-1"
      connection_string: "memcache://127.0.0.1:11211?timeout=10&tcp_nodelay=true"
      expiration_sec: 500
      # Largest file stored in this backend; keep below memcached's -I limit. 0 disables the check.
      max_file_size_bytes: 1047552
      # Higher priorities are fetched from first; defaults to 0.
      priority: 10
  valkey:
    - tag: "valkey-1"
      # Credentials go into the URL, e.g. valkey://user:password@host:6379/0
      connection_string: "valkey://127.0.0.1:6379/0"
      expiration_sec: 3600
      # Valkey accepts values up to 512 MiB by default (proto-max-bulk-len).
      max_file_size_bytes: 67108864
      # Prefer the fast cache over slower backends.
      priority: 10
  gcs:
    - tag: "gcs-1"
      bucket: "my-yeet-yoink-bucket"
      prefix: "files"
      # Without a key file, Application Default Credentials are used.
      # service_account_path: "/etc/yeet-yoink/service-account.json"
      # Cloud Storage has no per-object expiry: the expiry is checked on fetch,
      # and a bucket lifecycle rule should delete old objects.
      expiration_sec: 86400
      # Optional; files are streamed in both directions, so there is no limit by default.
      # max_file_size_bytes: 1073741824
  azure:
    - tag: "azure-1"
      account: "mystorageaccount"
      container: "yeet-yoink"
      prefix: "files"
      # Without an access key or SAS token file, credentials come from the
      # environment, e.g. AKS workload identity or a managed identity.
      # access_key_file: "/etc/yeet-yoink/azure/access-key"
      # Blob Storage has no per-blob expiry: the expiry is checked on fetch, and
      # a lifecycle management policy should delete old blobs.
      expiration_sec: 86400
  s3:
    - tag: "s3-1"
      bucket: "yeet-yoink"
      prefix: "files"
      region: "eu-central-1"
      # For S3-compatible stores such as MinIO, Ceph or SeaweedFS:
      # endpoint: "https://s3.example.com"
      # Without key files, credentials come from the environment, e.g. an EKS
      # service account role.
      # access_key_id_file: "/etc/yeet-yoink/s3/access-key-id"
      # secret_access_key_file: "/etc/yeet-yoink/s3/secret-access-key"
      # S3 has no per-object expiry: the expiry is checked on fetch, and a
      # lifecycle rule on the bucket should delete old objects.
      expiration_sec: 86400

# Optional: find and gossip with other instances, see deploy/kubernetes/cluster.yaml.
# Settings can be overridden by environment variables such as YY_CLUSTER__ADVERTISE_IP.
# cluster:
#   cluster_id: "yeet-yoink"
#   listen_addr: "0.0.0.0:7946"
#   advertise_ip: "10.0.0.12"
#   seeds:
#     - "yeet-yoink-gossip.my-namespace.svc.cluster.local:7946"
#   secret_file: "/etc/yeet-yoink/gossip/secret"
