---
version: 0
backends:
  memcache:
    - tag: "memcache-1"
      connection_string: "memcache://127.0.0.1:11211?timeout=10&tcp_nodelay=true"
      expiration_sec: 500
      # Largest file stored in this backend; keep below memcached's -I limit. 0 disables the check.
      max_file_size_bytes: 1047552
      # Higher priorities are fetched from first; defaults to 0.
      priority: 10
  valkey:
    - tag: "valkey-1"
      # Credentials go into the URL, e.g. valkey://user:password@host:6379/0
      connection_string: "valkey://127.0.0.1:6379/0"
      expiration_sec: 3600
      # Valkey accepts values up to 512 MiB by default; fetched files are held in memory.
      max_file_size_bytes: 67108864
