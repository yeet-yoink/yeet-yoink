---
version: 0
backends:
  memcache:
    - tag: "memcache-1"
      connection_string: "memcache://127.0.0.1:11211?timeout=10&tcp_nodelay=true"
      expiration_sec: 500
      # Largest file stored in this backend; keep below memcached's -I limit. 0 disables the check.
      max_file_size_bytes: 1047552
      # Higher priorities are fetched from first; defaults to 0.
      priority: 10
  valkey:
    - tag: "valkey-1"
      # Credentials go into the URL, e.g. valkey://user:password@host:6379/0
      connection_string: "valkey://127.0.0.1:6379/0"
      expiration_sec: 3600
      # Valkey accepts values up to 512 MiB by default (proto-max-bulk-len).
      max_file_size_bytes: 67108864
      # Prefer the fast cache over slower backends.
      priority: 10
  gcs:
    - tag: "gcs-1"
      bucket: "my-yeet-yoink-bucket"
      prefix: "files"
      # Without a key file, Application Default Credentials are used.
      # service_account_path: "/etc/yeet-yoink/service-account.json"
      # Cloud Storage has no per-object expiry: the expiry is checked on fetch,
      # and a bucket lifecycle rule should delete old objects.
      expiration_sec: 86400
      # Optional; files are streamed in both directions, so there is no limit by default.
      # max_file_size_bytes: 1073741824
