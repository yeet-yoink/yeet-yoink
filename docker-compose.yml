version: "3.8"
services:

  valkey:
    image: "valkey/valkey:alpine"
    ports:
      - "6379:6379"
    healthcheck:
      test: valkey-cli ping
      interval: 10s
      retries: 60

  memcached:
    image: "memcached:alpine"
    entrypoint:
      - memcached
      - -m 64
      - --verbose
      - --enable-largepages
    expose:
      - "11211/tcp"
    ports:
      - "11211:11211"
    healthcheck:
      test: echo stats | nc 127.0.0.1 11211
      interval: 10s
      retries: 60
