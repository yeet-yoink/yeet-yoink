version: "3.8"
services:

  valkey:
    image: "valkey/valkey:alpine"
    ports:
      - "6379:6379"
    healthcheck:
      test: valkey-cli ping
      interval: 10s
      retries: 60

  # Cloud Storage emulator. The fork supports the XML API uploads that
  # object_store uses; see fsouza/fake-gcs-server#1164.
  fake-gcs:
    image: "tustvold/fake-gcs-server"
    command: ["-scheme", "http", "-backend", "memory", "-public-host", "localhost:4443"]
    ports:
      - "4443:4443"

  # Azure Blob Storage emulator.
  azurite:
    image: "mcr.microsoft.com/azure-storage/azurite"
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"

  memcached:
    image: "memcached:alpine"
    entrypoint:
      - memcached
      - -m 64
      - --verbose
      - --enable-largepages
    expose:
      - "11211/tcp"
    ports:
      - "11211:11211"
    healthcheck:
      test: echo stats | nc 127.0.0.1 11211
      interval: 10s
      retries: 60
