# Example: yeet-yoink instances that find each other within and across namespaces.
#
# Apply this per namespace (replace NAMESPACE). Every namespace uses the same
# gossip secret; instances with another secret are ignored. Seeds may name the
# headless service of any namespace: one reachable seed is enough, since
# instances learn of all others through gossip.
#
#   kubectl -n NAMESPACE create secret generic yeet-yoink-gossip \
#     --from-literal=secret="$(head -c 48 /dev/urandom | base64)"
---
apiVersion: v1
kind: Service
metadata:
  name: yeet-yoink-gossip
  namespace: NAMESPACE
spec:
  # Headless: the name resolves to the IPs of all pods.
  clusterIP: None
  # Resolve pods before they are ready, so that instances find each other
  # while starting.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: yeet-yoink
  ports:
    - name: gossip
      port: 7946
      protocol: UDP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yeet-yoink
  namespace: NAMESPACE
data:
  config.yaml: |
    version: 0
    backends: {}
    cluster:
      cluster_id: yeet-yoink
      listen_addr: "0.0.0.0:7946"
      secret_file: /etc/yeet-yoink/gossip/secret
      seeds:
        # The own namespace, and any other namespace to reach.
        - yeet-yoink-gossip.NAMESPACE.svc.cluster.local:7946
        - yeet-yoink-gossip.OTHER_NAMESPACE.svc.cluster.local:7946
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yeet-yoink
  namespace: NAMESPACE
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: yeet-yoink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yeet-yoink
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: yeet-yoink
          # Published by .github/workflows/container.yml; pin a release tag or digest.
          image: ghcr.io/yeet-yoink/yeet-yoink:latest
          args: ["--config", "/etc/yeet-yoink/config.yaml", "--http", "0.0.0.0:8080"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /livez, port: http }
          ports:
            - name: http
              containerPort: 8080
            - name: gossip
              containerPort: 7946
              protocol: UDP
          env:
            # Settings from the environment override the config file.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: YY_CLUSTER__NODE_ID
              value: "$(POD_NAMESPACE)/$(POD_NAME)"
            - name: YY_CLUSTER__ADVERTISE_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: YY_CLUSTER__NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          volumeMounts:
            # Uploaded and fetched files are buffered here.
            - name: buffer
              mountPath: /tmp
            - name: config
              mountPath: /etc/yeet-yoink/config.yaml
              subPath: config.yaml
            - name: gossip-secret
              mountPath: /etc/yeet-yoink/gossip
              readOnly: true
      volumes:
        - name: buffer
          emptyDir: {}
        - name: config
          configMap: { name: yeet-yoink }
        - name: gossip-secret
          secret: { secretName: yeet-yoink-gossip }
---
# Admits gossip from yeet-yoink instances in any namespace. Without a
# NetworkPolicy, all traffic is allowed anyway; with a default-deny policy,
# this is what lets the instances talk.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yeet-yoink-gossip
  namespace: NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: yeet-yoink
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: yeet-yoink
      ports:
        - port: 7946
          protocol: UDP
