---
name: Rust

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'crates/**'
      - 'bins/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'crates/**'
      - 'bins/**'
      - '.github/workflows/rust.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    services:
      memcached:
        image: memcached:alpine
        ports:
          - 11211:11211
      valkey:
        image: valkey/valkey:alpine
        ports:
          - 6379:6379
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
          # - windows-latest
    steps:
      - name: Install Protocol Buffers Compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - name: Check format
        run: cargo fmt --check
      - name: Build
        run: cargo build --workspace --verbose
      - uses: taiki-e/install-action@nextest
      - name: Start Cloud Storage emulator
        # Service containers cannot take arguments. The fork supports the XML
        # API uploads object_store uses; see fsouza/fake-gcs-server#1164.
        run: docker run -d -p 4443:4443 tustvold/fake-gcs-server -scheme http -backend memory -public-host localhost:4443
      - name: Start Azure Blob Storage emulator
        run: docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
      - name: Start S3-compatible store
        run: docker run -d -p 8333:8333 -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
      - name: Run tests
        run: cargo nextest run --workspace --verbose --all-features
        env:
          YY_TEST_MEMCACHE: memcache://127.0.0.1:11211
          YY_TEST_VALKEY: valkey://127.0.0.1:6379
          YY_TEST_GCS: http://localhost:4443
          YY_TEST_AZURITE: http://127.0.0.1:10000
          YY_TEST_S3: http://127.0.0.1:8333
      # - name: Run doctests
      #   run: cargo test --doc --verbose --all-features

  codecov:
    name: Code Coverage
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached:alpine
        ports:
          - 11211:11211
      valkey:
        image: valkey/valkey:alpine
        ports:
          - 6379:6379
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Install Protocol Buffers Compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: actions/checkout@v4
      - name: Start Cloud Storage emulator
        # Service containers cannot take arguments. The fork supports the XML
        # API uploads object_store uses; see fsouza/fake-gcs-server#1164.
        run: docker run -d -p 4443:4443 tustvold/fake-gcs-server -scheme http -backend memory -public-host localhost:4443
      - name: Start Azure Blob Storage emulator
        run: docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
      - name: Start S3-compatible store
        run: docker run -d -p 8333:8333 -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
      - name: Generate code coverage
        run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
        env:
          YY_TEST_MEMCACHE: memcache://127.0.0.1:11211
          YY_TEST_VALKEY: valkey://127.0.0.1:6379
          YY_TEST_GCS: http://localhost:4443
          YY_TEST_AZURITE: http://127.0.0.1:10000
          YY_TEST_S3: http://127.0.0.1:8333
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
          os: ubuntu
