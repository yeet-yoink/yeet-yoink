[package]
name = "backend-gcs"
version = "0.1.0"
edition = "2024"

[dependencies]
app-config = { version = "0.1.0", path = "../app-config", features = ["gcs"] }
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
backend-traits = { version = "0.1.0", path = "../backend-traits" }
file-distribution = { version = "0.1.0", path = "../file-distribution" }
futures = "0.3.34"
map-ok = "1.0.0"
object_store = { version = "0.14.2", default-features = false, features = ["gcp"] }
serde_json = "1.0.154"
shortguid = "0.7.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"

[dev-dependencies]
axum-extra = { version = "0.12.6", default-features = false, features = ["typed-header"] }
backbone = { path = "../backbone" }
rendezvous = "0.4.0"
reqwest = { version = "0.13.5", default-features = false }
shared-files = "0.5.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
