[package]
name = "backbone"
version = "0.1.0"
edition = "2024"

[dependencies]
async-tempfile = { version = "0.8.0", features = ["uuid"] }
async-trait = "0.1.92"
axum-extra = { version = "0.12.6", default-features = false, features = ["typed-header"] }
backend-traits = { version = "0.1.0", path = "../backend-traits" }
file-distribution = { path = "../file-distribution" }
hex = "0.4.3"
metrics = { path = "../metrics" }
rendezvous = "0.4.0"
shared-files = "0.5.0"
shortguid = "0.7.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-std", "macros", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
rendezvous = { version = "0.4.0", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "io-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
