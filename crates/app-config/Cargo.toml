[package]
name = "app-config"
version = "0.1.0"
edition = "2024"

[features]
memcache = []
valkey = []
gcs = ["url/serde"]
azure = ["url/serde"]
s3 = ["url/serde"]

[dependencies]
clap = "4.6.7"
config = "0.15.27"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
anyhow = "1.0.104"
matches = "0.1.10"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
serde_yaml = "0.9.34"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
