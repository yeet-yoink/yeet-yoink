[package]
name = "backend-traits"
version = "0.1.0"
edition = "2024"

[dependencies]
app-config = { version = "0.1.0", path = "../app-config" }
async-trait = "0.1.92"
file-distribution = { version = "0.1.0", path = "../file-distribution" }
shortguid = "0.7.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
