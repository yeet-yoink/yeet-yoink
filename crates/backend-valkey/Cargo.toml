[package]
name = "backend-valkey"
version = "0.1.0"
edition = "2024"

[dependencies]
app-config = { version = "0.1.0", path = "../app-config", features = ["valkey"] }
async-trait = "0.1.92"
bytes = "1.12.1"
backend-traits = { version = "0.1.0", path = "../backend-traits" }
file-distribution = { version = "0.1.0", path = "../file-distribution" }
futures = "0.3.34"
map-ok = "1.0.0"
redis = { version = "1.8.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
shortguid = "0.7.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"

[dev-dependencies]
axum-extra = { version = "0.12.6", default-features = false, features = ["typed-header"] }
backbone = { path = "../backbone" }
rendezvous = "0.4.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
